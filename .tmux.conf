
# change hotkey from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support by default
set -g mouse on

# to play nice with claude code + nvim if using that way
set -g focus-events on

# Allow Claude Code to pass desktop notifications and progress bars to your host terminal
set -g allow-passthrough on

# Extended keys: "on" only when the outer terminal supports them (not "always",
# which forces modifyOtherKeys sequences that leak as literal text in some CLIs).
set -g extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'
set -as terminal-features 'xterm*:extkeys'



